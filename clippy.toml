too-large-for-stack = 128
doc-valid-idents = [
    "P2P",
    "ExEx",
    "ExExes",
    "IPv4",
    "IPv6",
    "KiB",
    "MiB",
    "GiB",
    "TiB",
    "PiB",
    "EiB",
    "WAL",
    "MessagePack",
]
allow-dbg-in-tests = true
# The strict lints in seismic.yml's clippy job (-W clippy::unwrap_used etc.,
# promoted to errors by -D warnings) target production code; test code may
# unwrap/expect/panic/index freely.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
