[package]
name = "seismic-reth-genesis-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[[bin]]
# the CLI keeps the short name; the genesis-drift CI job and the docs
# invoke it as `cargo run --bin genesis-builder`
name = "genesis-builder"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
reth-seismic-genesis-builder = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
