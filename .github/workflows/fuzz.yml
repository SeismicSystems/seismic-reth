name: Seismic Fuzzing

on:
  schedule:
    # Nightly at 2am UTC
    - cron: '0 2 * * *'
  push:
    branches: [seismic]
    paths:
      - 'crates/seismic/**'
  pull_request:
    branches: [seismic]
    paths:
      - 'crates/seismic/**'
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: 'Number of proptest cases per test'
        default: '2048'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - precompiles
          - tx_encoding
          - evm_execution
          - flagged_storage
          - differential
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fuzz-cache"

      - name: Run fuzz tests (${{ matrix.test }})
        env:
          PROPTEST_CASES: ${{ github.event.inputs.proptest_cases || '2048' }}
        run: |
          cargo test -p reth-seismic-fuzz --test ${{ matrix.test }} -- --test-threads=1

      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions-${{ matrix.test }}
          path: crates/seismic/fuzz/proptest-regressions/
