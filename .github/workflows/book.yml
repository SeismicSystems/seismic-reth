# Documentation and mdbook related jobs.

name: book

on:
  push:
    branches: [seismic]
  pull_request:
    branches: [seismic]
    types: [opened, reopened, synchronize, closed]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright browsers
        # Required for rehype-mermaid to render Mermaid diagrams during build
        run: |
          cd docs/vocs/
          bun i
          npx playwright install --with-deps chromium

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build docs
        run: cd docs/vocs && bash scripts/build-cargo-docs.sh

      - name: Build Vocs
        run: |
          cd docs/vocs/ && bun run build
          echo "Vocs Build Complete"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs/vocs/docs/dist"

  deploy:
    # Only deploy if a push to seismic
    if: github.ref_name == 'seismic' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build]

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    timeout-minutes: 60

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
