[package]
name = "reth-seismic-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Seismic primitive types"

[lints]
workspace = true

[dependencies]
seismic-crypto.workspace = true

# reth
reth-primitives-traits = { workspace = true, features = ["serde"] }
reth-codecs = { workspace = true, optional = true }
reth-zstd-compressors = { workspace = true, optional = true }
revm-context.workspace = true

# ethereum
alloy-evm.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-eips = { workspace = true, features = ["k256"] }
alloy-network = { workspace = true }

# seismic
seismic-alloy-consensus.workspace = true
seismic-alloy-network = { workspace = true }
seismic-revm.workspace = true

# codec
bytes = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

# misc
derive_more = { workspace = true, features = ["deref", "from", "into", "constructor"] }
secp256k1 = { workspace = true, features = ["rand", "std", "global-context", "recovery"] }
anyhow.workspace = true
tracing.workspace = true

# test
arbitrary = { workspace = true, features = ["derive"], optional = true }
rand_08 = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }

# test utils
alloy-signer-local.workspace = true
alloy-rpc-types.workspace = true
k256.workspace = true
enr = { workspace = true, features = ["rust-secp256k1"] }
alloy-dyn-abi.workspace = true
seismic-alloy-rpc-types.workspace = true

[dev-dependencies]
arbitrary.workspace = true
proptest-arbitrary-interop.workspace = true
proptest.workspace = true
rand.workspace = true
rand_08.workspace = true
reth-codecs = { workspace = true, features = ["test-utils"] }
rstest.workspace = true
serde_json.workspace = true
bincode.workspace = true

[features]
default = ["std", "serde", "serde-bincode-compat", "reth-codec"]
timestamp-in-seconds = ["seismic-revm/timestamp-in-seconds"]
std = [
    "reth-primitives-traits/std",
    "reth-codecs?/std",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "serde?/std",
    "bytes?/std",
    "derive_more/std",
    "secp256k1/std",
    "alloy-rlp/std",
    "reth-zstd-compressors?/std",
    "seismic-alloy-consensus/std",
    "revm-context/std",
    "serde_json/std",
    "alloy-evm/std",
    "serde_with?/std",
    "k256/std",
    "seismic-alloy-network/std",
    "seismic-alloy-rpc-types/std",
    "tracing/std",
]
reth-codec = [
    "dep:reth-codecs",
    "std",
    "dep:proptest",
    "reth-primitives-traits/reth-codec",
    "reth-codecs?/op",
    "dep:bytes",
    "dep:modular-bitfield",
    "dep:reth-zstd-compressors",
]
serde = [
    "dep:serde",
    "reth-primitives-traits/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "bytes?/serde",
    "reth-codecs?/serde",
    "seismic-alloy-consensus/serde",
    "rand/serde",
    "secp256k1/serde",
    "revm-context/serde",
    "enr/serde",
    "k256/serde",
    "rand_08?/serde",
    "seismic-alloy-network/serde",
    "seismic-alloy-rpc-types/serde",
    "seismic-revm/serde",
]
serde-bincode-compat = [
    "serde",
    "serde_with",
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "seismic-alloy-consensus/serde-bincode-compat",
    "reth-primitives-traits/serde-bincode-compat",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    # "dep:secp256k1",
    "secp256k1/rand",
    "reth-primitives-traits/arbitrary",
    "reth-codecs?/arbitrary",
    "seismic-alloy-consensus/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "rand_08",
    "alloy-dyn-abi/arbitrary",
    "alloy-rpc-types/arbitrary",
    "seismic-alloy-rpc-types/arbitrary",
]
