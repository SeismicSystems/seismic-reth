[features]
default = ["reth-codec"]
timestamp-in-seconds = [
    "seismic-revm/timestamp-in-seconds",
    "reth-node-builder/timestamp-in-seconds",
    "reth-primitives-traits/timestamp-in-seconds",
    "reth-seismic-evm/timestamp-in-seconds",
    "reth-seismic-payload-builder/timestamp-in-seconds",
    "reth-seismic-primitives/timestamp-in-seconds",
    "reth-seismic-rpc/timestamp-in-seconds",
    "reth-seismic-chainspec/timestamp-in-seconds",
]
asm-keccak = [
    "alloy-primitives/asm-keccak",
    "revm/asm-keccak",
    "reth-seismic-node/asm-keccak",
    "reth-node-core/asm-keccak",
]
js-tracer = [
    "reth-node-builder/js-tracer",
]
test-utils = [
    "reth-tasks",
    "reth-e2e-test-utils",
    "reth-node-builder/test-utils",
    "reth-chainspec/test-utils",
    "reth-consensus/test-utils",
    "reth-evm/test-utils",
    "reth-network/test-utils",
    "reth-payload-builder/test-utils",
    "reth-revm/test-utils",
    "reth-provider/test-utils",
    "reth-transaction-pool/test-utils",
    "reth-trie-db/test-utils",
    "reth-seismic-node/test-utils",
    "reth-seismic-primitives/arbitrary",
    "reth-primitives-traits/test-utils",
]
reth-codec = [
    "reth-seismic-primitives/reth-codec",
]
